plugins { id 'spring-boot-common-conventions' }
dependencies {
    implementation project(':payment-service-domain:payment-domain-core')
    implementation project(':payment-service-domain:payment-application-service')
    implementation project(':payment-service-persistence')
    implementation project(':payment-service-restapi')
    implementation 'kh.eco.istad:istad-common-restapi'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.0.2'
}
