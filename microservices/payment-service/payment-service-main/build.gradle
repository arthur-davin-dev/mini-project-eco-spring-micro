plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}
dependencies {
    implementation project(':payment-service-domain:payment-domain-core')
    implementation project(':payment-service-domain:payment-application-service')
    implementation project(':payment-service-persistence')
    implementation project(':payment-service-restapi')
    implementation libs.istad.common.restapi
    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.cloud.starter.consul.discovery
    implementation libs.istad.common.swagger
    implementation libs.springdoc.webmvc.ui
    implementation libs.springdoc.webmvc.scalar
}
