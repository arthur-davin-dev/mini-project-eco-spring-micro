plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {
    implementation libs.liquibase.core
    implementation libs.spring.boot.starter.liquibase
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation libs.spring.boot.starter.webclient
    runtimeOnly libs.postgresql
    runtimeOnly libs.r2dbc.postgresql

    implementation project(':order-service-domain:order-domain-core')
    implementation project(':order-service-domain:order-application-service')
    implementation project(':order-service-persistence')
    implementation project(':order-service-restapi')
    implementation project(':order-service-client')

    implementation libs.istad.common.restapi

    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.actuator
    implementation libs.istad.common.swagger
    implementation libs.springdoc.webmvc.ui
    implementation libs.springdoc.webmvc.scalar
    implementation libs.spring.cloud.starter.consul.discovery
    implementation libs.spring.cloud.starter.consul.config
}
