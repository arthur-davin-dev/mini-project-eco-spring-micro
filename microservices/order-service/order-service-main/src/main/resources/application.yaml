server:
  port: ${ORDER_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

scalar:
  enabled: true
  url: /v3/api-docs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

services:
  customer:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8083}
    timeout-ms: 3000
  business:
    base-url: ${BUSINESS_SERVICE_URL:http://localhost:8082}
    timeout-ms: 3000
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
    timeout-ms: ${PAYMENT_SERVICE_TIMEOUT_MS:5000}

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5433/order_db}
    username: ${ORDER_DB_USERNAME:postgres}
    password: ${ORDER_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

eureka:
  client:
    enabled: false

discovery:
  enabled: false
