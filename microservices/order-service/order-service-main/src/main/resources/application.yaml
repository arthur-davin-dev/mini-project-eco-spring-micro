server:
  port: ${ORDER_SERVICE_PORT:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

scalar:
  enabled: true
  url: /v3/api-docs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

customer-service:
  base-url: ${CUSTOMER_SERVICE_URL:http://customer-service}
  timeout-ms: 3000
business-service:
  base-url: ${BUSINESS_SERVICE_URL:http://business-service}
  timeout-ms: 3000
payment-service:
  base-url: ${PAYMENT_SERVICE_URL:http://payment-service}
  timeout-ms: ${PAYMENT_SERVICE_TIMEOUT_MS:5000}

spring:
  cloud:
    discovery:
      enabled: true
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5433/order_db}
    username: ${ORDER_DB_USERNAME:postgres}
    password: ${ORDER_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health
