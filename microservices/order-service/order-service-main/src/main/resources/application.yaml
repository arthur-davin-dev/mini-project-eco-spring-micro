server:
  port: 8081

scalar:
  enabled: true
  url: /v3/api-docs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

services:
  customer:
    base-url: http://localhost:8083
    timeout-ms: 3000
  business:
    base-url: http://localhost:8082
    timeout-ms: 3000

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
