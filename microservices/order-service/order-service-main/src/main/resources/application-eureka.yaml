# Active only with:  --spring.profiles.active=eureka
discovery:
  enabled: true

# the logical service name registered in Eureka.
services:
  customer:
    base-url: http://customer-service
  business:
    base-url: http://business-service
  payment:
    base-url: http://payment-service

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
