server:
  port: ${BUSINESS_SERVICE_PORT:9988}
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

scalar:
  enabled: true
  url: /v3/api-docs

springdoc:
  api-docs:
    enabled: true
#  swagger-ui:
#    enabled: true

spring:
  cloud:
    discovery:
      enabled: true
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-path: /actuator/health
  application:
    name: business-service
  profiles:
    active: dev


  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    uri: ${BUSINESS_MONGODB_URI:mongodb://mongod:mongod@localhost:2026/business_db?authSource=admin}
