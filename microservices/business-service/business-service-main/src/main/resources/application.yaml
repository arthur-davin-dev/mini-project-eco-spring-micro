server:
  port: ${BUSINESS_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

scalar:
  enabled: true
  url: /v3/api-docs

springdoc:
  api-docs:
    enabled: true
#  swagger-ui:
#    enabled: true

spring:
  application:
    name: business-service
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    uri: ${BUSINESS_MONGODB_URI:mongodb://mongod:mongod@localhost:2026/business_db?authSource=admin}

eureka:
  client:
    enabled: false
