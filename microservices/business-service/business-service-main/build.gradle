plugins {
    id 'spring-boot-common-conventions'
}

dependencies {
    implementation project(':business-service-domain:business-domain-core')
    implementation project(':business-service-domain:business-application-service')
    implementation project(':business-service-persistence')
    implementation project(':business-service-restapi')

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.0.2'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-scalar:3.0.2'
}

tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}