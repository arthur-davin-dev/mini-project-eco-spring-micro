plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {
    implementation project(':business-service-domain:business-domain-core')
    implementation project(':business-service-domain:business-application-service')
    implementation project(':business-service-persistence')
    implementation project(':business-service-restapi')
    implementation libs.spring.cloud.starter.consul.discovery
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation libs.spring.boot.starter.webflux
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.data.mongodb.reactive
    implementation libs.istad.common.swagger
    implementation libs.springdoc.webflux.ui
    implementation libs.springdoc.webflux.scalar
}

tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
