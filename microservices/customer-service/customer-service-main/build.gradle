plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {
    implementation project(':customer-service-domain:customer-domain-core')
    implementation project(':customer-service-domain:customer-application-service')
    implementation project(':customer-service-persistence')
    implementation project(':customer-service-restapi')

    implementation libs.istad.common.restapi
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.cloud.starter.netflix.eureka.client
    implementation libs.istad.common.swagger
    implementation libs.springdoc.webmvc.ui
    implementation libs.springdoc.webmvc.scalar
    implementation libs.spring.cloud.starter.consul.discovery
}

tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
