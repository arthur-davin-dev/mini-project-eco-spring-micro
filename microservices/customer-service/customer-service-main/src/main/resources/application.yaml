server:
  port: ${CUSTOMER_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

scalar:
  enabled: true
  url: /v3/api-docs

springdoc:
  api-docs:
    enabled: true

spring:
  application:
    name: customer-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://127.0.0.1:9000}

  cloud:
    discovery:
      enabled: true
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-path: /actuator/health
#        health-check-interval: 15s

  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5434/customer_db}
    username: ${CUSTOMER_DB_USERNAME:postgres}
    password: ${CUSTOMER_DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
