
server:
  port: ${CUSTOMER_SERVICE_PORT:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

scalar:
  enabled: true
  url: /v3/api-docs

springdoc:
  api-docs:
    enabled: true

spring:
  cloud:
    discovery:
      enabled: true
  application:
    name: customer-service

  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5434/customer_db}
    username: ${CUSTOMER_DB_USERNAME:postgres}
    password: ${CUSTOMER_DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
