eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    # Send Spring Boot Actuator health (not just "heartbeat") to Eureka.
    healthcheck:
      enabled: true
    # How often this client refreshes its local copy of the registry (default 30 s).
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Unique per instance, so 2 copies on different ports both show up.
    instance-id: ${spring.application.name}:${server.port}
    # Lab values (defaults: 30 s / 90 s) so Part 4 results appear quickly.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
