server:
  port: 9999

spring:
  application:
    name: gateway-server
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-url: ${GATEWAY_HEALTH_CHECK_URL:http://host.docker.internal:${server.port}/actuator/health}
        health-check-interval: 15s

    gateway:
      server:
        webflux:
#          default-filters:
#            - SaveSession
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: my-rder-service
              uri: lb://order-service
              predicates:
                - Path=/my-order/**
              filters:
                - RewritePath=/my-order/?(?<segment>.*), /$\{segment}
#                - SaveSession
            - id: json-place-holder
              uri: https://jsonplaceholder.typicode.com/photos
              predicates:
                - Path=/jph/**
              filters:
                - RewritePath=/jph/?(?<segment>.*), /$\{segment}
            - id: nextjs
              uri: http://localhost:3000
              predicates:
                - Path=/**


  profiles:
    active: dev
management:
  endpoints:
    web:
      exposure:
        include: "health , gateway, info"
  endpoint:
    gateway:
      access: read_only
