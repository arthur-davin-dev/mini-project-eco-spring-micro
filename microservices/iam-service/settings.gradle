pluginManagement {
    includeBuild('../../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        mavenCentral()
        ivy {
            name = 'Node.js'
            url = uri('https://nodejs.org/dist/')
            patternLayout {
                artifact('v[revision]/[artifact](-v[revision]-[classifier]).[ext]')
            }
            metadataSources {
                artifact()
            }
            content {
                includeModule('org.nodejs', 'node')
            }
        }
    }

    versionCatalogs {
        libs {
            from(files("../../gradle/libs.versions.toml"))
        }
    }
}

rootProject.name = "iam-service"
include 'iam-domain:iam-domain-core'
include 'iam-domain:iam-application-service'
include 'iam-persistence'
include 'iam-rest-api'
include 'iam-infrastructure'
include 'iam-web'
include 'iam-main'
