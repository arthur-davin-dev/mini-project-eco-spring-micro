plugins {
    id 'com.github.node-gradle.node' version '7.1.0'
    id 'spring-common-conventions'
}

node {
    download = false
    nodeProjectDir = file('iam-web')
}

tasks.register('buildReactFrontend', com.github.gradle.node.npm.task.NpmTask) {
    args = ['run', 'build']
}

tasks.named('processResources') {
    dependsOn(tasks.named('buildReactFrontend'))
}

dependencies {
    implementation project(':iam-domain:iam-application-service')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
}
