plugins {
    id 'spring-common-conventions'
    id 'gg.jte.gradle' version '3.2.5'
}

jte {
    precompile()
}

sourceSets.main.output.dir(layout.projectDirectory.dir('jte-classes'))
tasks.named('jar') {
    dependsOn(tasks.named('precompileJte'))
}

dependencies {
    implementation project(':iam-domain:iam-application-service')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.5'
}
