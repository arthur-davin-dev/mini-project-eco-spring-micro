plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}
group = 'kh.eco.istad'
version = '1.0.0'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
}
dependencyManagement {
    imports {
        mavenBom(libs.spring.boot.dependencies.get().toString()) {
            // Keep Spring Boot's managed runtimes aligned with the published Buf SDK.
            bomProperty 'grpc-java.version', libs.versions.grpc.get()
            bomProperty 'protobuf-java.version', libs.versions.protobuf.java.get()
        }
    }
}

dependencies {
    annotationProcessor libs.lombok.mapstruct.binding
    annotationProcessor libs.mapstruct.processor
    compileOnly libs.mapstruct
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    implementation libs.spring.boot.starter.logging
    implementation libs.spring.boot.starter.validation
}


tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
