plugins {
    id 'java-library'
}

group = 'kh.eco.istad'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                libs.versions.java.get()
        )
    }
}

repositories {
    mavenCentral()
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
